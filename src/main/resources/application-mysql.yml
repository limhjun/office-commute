# 로컬 MySQL 검증용 설정
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/office_commute?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:office_user}
    password: ${DB_PASSWORD:office_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
        use_sql_comments: true

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    baseline-on-migrate: true
    placeholders:
      # 로컬 검증용 기본값 = V5 의 dev 해시(평문 admin1234) — 로컬 로그인 흐름 유지 (V11)
      admin_password_hash: ${ADMIN_PASSWORD_HASH:$2a$10$jg1.5WoxGYRAvXMnQbjuzO00fqODW80lysuhA0an2vD/VqgHY6MDm}

decorator:
  datasource:
    p6spy:
      enable-logging: true
      multiline: true
      logging: slf4j
      log-format: "Hibernate: %(sql)"

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type: trace
    org.springframework.security: debug
    p6spy: info
    com.company.officecommute: debug
    root: info

public:
  data:
    api:
      serviceKey: ${PUBLIC_API_SERVICE_KEY}
      url: ${PUBLIC_API_URL:https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService/getRestDeInfo}
      # 외부 API 타임아웃 — 재배포 없이 조정할 수 있도록 환경변수로 노출 (기본값 = 종전 하드코딩 값)
      connectTimeout: ${PUBLIC_API_CONNECT_TIMEOUT:3s}
      readTimeout: ${PUBLIC_API_READ_TIMEOUT:5s}

# 상태 변경 요청의 Origin 검사(CSRF) 허용 출처 — 로컬 Vite 개발 서버
app:
  security:
    allowed-origins: http://localhost:5173
