# 개발 환경 설정
spring:
  # H2 임베디드(인메모리) 데이터베이스 사용
  datasource:
    url: jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  
  # JPA 개발 설정
  jpa:
    hibernate:
      ddl-auto: create-drop  # 시작할 때 생성, 종료할 때 삭제
    defer-datasource-initialization: true
    properties:
      hibernate:
        show_sql: true  # SQL 쿼리 출력
        use_sql_comments: true
  
  # SQL 초기화
  sql:
    init:
      mode: always  # 항상 data.sql 실행

  flyway:
    enabled: false

# P6Spy - SQL 로깅 라이브러리
decorator:
  datasource:
    p6spy:
      enable-logging: true
      multiline: true
      logging: slf4j
      log-format: "Hibernate: %(sql)"

# 개발용 로깅 설정 (상세하게)
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type: trace
    org.springframework.security: debug
    p6spy: info
    com.company.officecommute: debug
    root: info

# 개발용 API 설정 (환경변수 사용)
public:
  data:
    api:
      serviceKey: ${PUBLIC_API_SERVICE_KEY}
      url: ${PUBLIC_API_URL:https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService/getRestDeInfo}
      # 외부 API 타임아웃 — 재배포 없이 조정할 수 있도록 환경변수로 노출 (기본값 = 종전 하드코딩 값)
      connectTimeout: ${PUBLIC_API_CONNECT_TIMEOUT:3s}
      readTimeout: ${PUBLIC_API_READ_TIMEOUT:5s}

# 상태 변경 요청의 Origin 검사(CSRF) 허용 출처 — Vite 개발 서버 프록시는 Host 를 8080 으로 바꾸므로 명시한다
app:
  security:
    allowed-origins: http://localhost:5173
