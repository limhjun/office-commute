spring:
  profiles:
    active: test
  # 이 파일이 메인 application.yml 을 가리므로 메일 설정도 여기 있어야 한다.
  # spring.mail.host 가 없으면 JavaMailSender 빈이 만들어지지 않아 ReportMailer 주입이 깨진다.
  # 테스트에서 실제로 발송하는 경로는 없다(수신자 주소는 일부러 비워 둔다).
  mail:
    host: localhost
    port: 25
  # 메인 application.yml 과 같은 값. 빠지면 컨트롤러 테스트가 운영과 다른 JSON(null 필드 포함)을 검증한다.
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: false
    placeholders:
      # Flyway 를 켜는 테스트(MySQL Testcontainers)에서 V11 이 요구하는 값
      admin_password_hash: $2a$10$jg1.5WoxGYRAvXMnQbjuzO00fqODW80lysuhA0an2vD/VqgHY6MDm
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
    defer-datasource-initialization: true
